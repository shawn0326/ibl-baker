name: Checks
on:
  workflow_call:
    inputs:
      release_build:
        type: boolean
        default: false
      pages_artifact:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cargo-sources:
    if: ${{ !inputs.release_build }}
    name: pnpm Cargo (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: macos-arm64
            runner: macos-14
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:pnpm-cargo
      - run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: pnpm install --frozen-lockfile --offline
      - run: cargo check --locked --workspace --offline
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      IBL_FIXTURE_DIR: ${{ github.workspace }}/target/ci-fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Resolve pnpm cache paths
        if: ${{ !inputs.release_build }}
        id: pnpm-cache
        shell: bash
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "metadata=$(pnpm cache path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm npm and Cargo sources
        if: ${{ !inputs.release_build }}
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.metadata }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', 'pnpm-workspace.yaml', 'package.json', 'Cargo.toml', 'crates/*/Cargo.toml', 'packages/*/package.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:pnpm-cargo
      - run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: pnpm install --frozen-lockfile --offline
      - run: cargo metadata --locked --offline --format-version 1 > /dev/null
      - run: cargo check --locked --workspace --offline
      - run: cargo test --locked --workspace --offline
      - run: pnpm run check:ts
      - run: node scripts/release/run.mjs static
      - run: node --test scripts/release/tests/*.test.mjs
      - run: pnpm run test:cli
      - run: cargo build --release --locked -p ibl_cli
      - run: pnpm run ci:fixtures
      - run: pnpm run test:js
      - run: pnpm run test:ibla-viewer
      - run: pnpm run test:ktx2-viewer
      - run: node scripts/release/smoke.mjs
      - run: node scripts/release/cli-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.release_build
        with:
          name: ci-fixtures
          overwrite: true
          path: target/ci-fixtures/
          archive: true
          retention-days: 90
          if-no-files-found: error
      - name: Stage Pages
        if: inputs.pages_artifact
        run: |
          mkdir -p _site/ibla-viewer _site/ktx2-viewer
          cp -R packages/ibla-viewer/dist/. _site/ibla-viewer/
          cp -R packages/ktx2-viewer/dist/. _site/ktx2-viewer/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.pages_artifact
        with:
          path: _site
      - name: Save pnpm npm and Cargo sources
        if: ${{ success() && !inputs.release_build && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.metadata }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', 'pnpm-workspace.yaml', 'package.json', 'Cargo.toml', 'crates/*/Cargo.toml', 'packages/*/package.json') }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: quality-failure-${{ github.run_attempt }}
          path: |
            target/release/*.json
            target/release/*.log
          archive: true
          retention-days: 90
          if-no-files-found: ignore
