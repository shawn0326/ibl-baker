name: CLI binaries
on:
  workflow_call:
    inputs:
      npm_cli:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    name: Binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      RELEASE_INPUTS: ${{ toJSON(inputs) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: rustup toolchain install 1.98.0 --profile minimal --target ${{ matrix.target }}
      - run: npm run test:cli
      - run: cargo test --locked --workspace
      - run: node scripts/release/binary.mjs ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.platform }}
          overwrite: true
          path: target/binaries/
          archive: true
          retention-days: 90
          if-no-files-found: error
