name: Publish
on:
  workflow_dispatch:
    inputs:
      rust_cli:
        description: Publish all Rust crates and CLI binaries
        type: boolean
        default: false
      npm_ibla_loader:
        description: Publish @ibltools/ibla-loader
        type: boolean
        default: false
      npm_ktx2_loader:
        description: Publish @ibltools/ktx2-loader
        type: boolean
        default: false
      npm_cli:
        description: Publish @ibltools/cli and all three platform packages
        type: boolean
        default: false
      dry_run:
        description: Validate candidate only (no upload or approval)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ibl-baker-publish
  cancel-in-progress: false
env:
  RELEASE_INPUTS: ${{ toJSON(inputs) }}
  IBL_FIXTURE_DIR: ${{ github.workspace }}/target/ci-fixtures
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Require master and a package selection
        run: |
          test "$GITHUB_REPOSITORY" = shawn0326/ibl-baker
          test "$GITHUB_REF" = refs/heads/master
          node -e 'const i = JSON.parse(process.env.RELEASE_INPUTS); if (!["rust_cli","npm_ibla_loader","npm_ktx2_loader","npm_cli"].some(k => i[k] === true)) process.exit(1)'

  checks:
    needs: source
    uses: ./.github/workflows/checks.yml
    with:
      release_build: true

  binaries:
    needs: source
    if: inputs.rust_cli || inputs.npm_cli
    uses: ./.github/workflows/release.yml
    with:
      npm_cli: ${{ inputs.npm_cli }}

  candidate:
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') }}
    needs: [checks, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - name: Restore original candidate on rerun
        id: restore
        run: npm run release -- restore
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: (inputs.rust_cli || inputs.npm_cli) && steps.restore.outputs.restored != 'true'
        with:
          pattern: binary-*
          merge-multiple: true
          digest-mismatch: error
          path: target/binaries
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-fixtures
          digest-mismatch: error
          path: target/ci-fixtures
      - name: Build and validate selected packages
        if: steps.restore.outputs.restored != 'true'
        run: npm run release -- prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.restore.outputs.restored != 'true'
        with:
          archive: true
          name: release-candidate
          path: target/release/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          archive: true
          name: candidate-failure-${{ github.run_attempt }}
          path: target/release/
          if-no-files-found: ignore
          retention-days: 90

  cli-candidate:
    needs: candidate
    if: inputs.npm_cli
    uses: ./.github/workflows/cli-consumer.yml
    with:
      mode: candidate
      release_inputs: ${{ toJSON(inputs) }}

  publish:
    needs: [candidate, cli-candidate]
    if: ${{ !cancelled() && !inputs.dry_run && needs.candidate.result == 'success' && (needs.cli-candidate.result == 'success' || needs.cli-candidate.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.11.0
      - run: npm ci --ignore-scripts
      - run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: release-candidate
          path: target/release/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.npm_cli
        with:
          pattern: cli-candidate-*
          merge-multiple: true
          digest-mismatch: error
          path: target/release/
      - run: npm run release -- validate
      - name: Obtain temporary crates.io token
        if: inputs.rust_cli
        id: cargo-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish Cargo packages in dependency order
        if: inputs.rust_cli
        run: npm run release -- publish-cargo
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}
      - name: Publish selected npm packages (CLI platforms before entry)
        run: npm run release -- publish-npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          archive: true
          name: publish-evidence-${{ github.run_attempt }}
          path: target/release/
          if-no-files-found: ignore
          retention-days: 90

  verify:
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm ci --ignore-scripts
      - run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: release-candidate
          path: target/release/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-fixtures
          digest-mismatch: error
          path: target/ci-fixtures
      - run: npm run release -- verify
      - id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          archive: true
          name: registry-evidence-${{ github.run_attempt }}
          path: target/release/
          if-no-files-found: error
          retention-days: 90

  cli-registry:
    needs: publish
    if: inputs.npm_cli
    uses: ./.github/workflows/cli-consumer.yml
    with:
      mode: registry
      release_inputs: ${{ toJSON(inputs) }}

  finalize:
    needs: [verify, cli-registry]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.cli-registry.result == 'success' || needs.cli-registry.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: target/release/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.npm_cli
        with:
          pattern: cli-*
          merge-multiple: true
          digest-mismatch: error
          path: target/release/
      - run: npm run release -- finalize
        env:
          GH_TOKEN: ${{ github.token }}
