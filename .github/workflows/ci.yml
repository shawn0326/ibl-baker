name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    if: github.event_name == 'workflow_dispatch' # Temporary skipped-upstream acceptance check.
    uses: ./.github/workflows/checks.yml
    with:
      pages_artifact: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
  ci-gate:
    name: CI Gate
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "Checks result: $CHECKS_RESULT"
          test "$CHECKS_RESULT" = success
  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: checks
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
